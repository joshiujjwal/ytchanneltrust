services:
  postgres:
    image: postgres:16-alpine
    container_name: ytreviews-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytreviews
      POSTGRES_PASSWORD: ytreviews_password
      POSTGRES_DB: ytreviews
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytreviews"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
